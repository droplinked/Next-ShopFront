# PR verification — the gate this repo did not have.
#
# Next-ShopFront serves shop.droplinked.com: 23,025 ACP feed product URLs,
# server-rendered. Until this workflow landed, no pull_request check in this
# repo compiled a single line of TypeScript or executed a single test. The PR
# checks were append-draft, sanity, enforce-source-branch, verify provenance,
# CodeQL and Analyze — none of which typecheck the app or run its tests.
# Branch protection could not be enabled because there was nothing meaningful
# to require. This is the thing to require.
#
# Stable check name (the string to put in branch protection):
#
#     typecheck + tests
#
# It is the `name:` of the single job below and is deliberately identical to
# the required check on droplinked-mcp, so one string covers both repos.
# Renaming the job silently un-requires the check — treat the name as an API.
#
# ── Why there is NO `paths:` / `paths-ignore:` filter ──────────────────────
# A `paths-ignore:` on a *required* check does not make the check pass on a
# docs-only PR — it makes the workflow never start, which leaves the required
# context permanently **pending** and wedges the PR forever with no way to
# clear it. That is exactly what blocks branch protection on two sibling
# repos today, and this repo's own audit-signatures.yml carries the same
# `paths-ignore:` (harmless only because it is not required).
#
# So: the job ALWAYS runs on every PR to main/stage/dev. CI minutes on
# docs-only PRs are saved *inside* the job, by the "Classify change scope"
# step below, which short-circuits the expensive steps and still reports
# success. Skip work, never the check.
#
# ── Why `next build` runs BEFORE `tsc` ────────────────────────────────────
# Measured on dev @ 4df0338, not assumed. Next generates `next-env.d.ts` and
# `.next/types/routes.d.ts` *during* the build; those are what declare the
# `*.png` / `*.svg` static-asset modules this app imports. A cold tsc on a
# fresh checkout therefore reports 8 phantom errors (2× TS2307 "Cannot find
# module '@/assets/icons/*.png'" for files that exist on disk, 6× TS2322
# "Property 'className' does not exist on type 'IntrinsicAttributes'" on SVGR
# components). After `next build`, the same tsc on the same tree reports 0.
# Ordering build → typecheck is load-bearing; inverting it would report a
# healthy repo as broken.
#
# ── Why the install is `npm ci --legacy-peer-deps` ────────────────────────
# It matches the deploy, byte for byte on the resolution-affecting flags.
# Dockerfile:31 is `npm ci --legacy-peer-deps`; audit-signatures.yml uses the
# same. Bare `npm ci` FAILS on untouched dev — the lockfile is peer-incomplete
# (51 "Missing: ... from lock file" entries, led by
# @droplinked_inc/web3-kit@0.1.0 and @droplinked_inc/wallet-connection@0.1.1,
# both declared as peerDependencies of @droplinked_inc/web3@1.0.0 and absent
# from the lock). Repairing the lockfile is a separate PR with its own smoke
# plan — it changes what the shipped image installs, and per usePayment.ts the
# crypto path currently throws precisely because that surface is unsatisfied.
# A gate that installs a different tree from the one that deploys is testing
# a fiction; droplinked-shopfront's pre-merge-checks makes that mistake today
# (`npm ci` in the gate, `npm install` in the deploy) while its own comment
# claims otherwise. `--no-audit --no-fund` are output-only and do not affect
# resolution.

name: PR verification

on:
  pull_request:
    branches: [main, stage, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  # Forward-compatibility: if a merge queue is ever enabled, a required check
  # that does not run on merge_group wedges the queue the same way a
  # paths-ignore wedges a docs PR. One line now, no failure mode later.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ─────────────────────────────────────────────────────────────────────
    # THE REQUIRED CHECK NAME. Do not rename without updating branch
    # protection in the same change.
    # ─────────────────────────────────────────────────────────────────────
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scope classifier can diff base..head without
          # a second fetch. Cheap on a repo this size.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 22 matches the deploy (Dockerfile: `FROM node:22-alpine`,
          # required by @droplinked_inc/web3@1.0.0 engines.node >=22). It is
          # also the floor for `node --test` glob arguments, which package.json's
          # `test` script relies on. audit-signatures.yml still pins 20; that
          # is a pre-existing divergence, not one this workflow copies.
          node-version: '22'
          cache: 'npm'

      # ── Docs-only short-circuit ───────────────────────────────────────
      # This is the ONLY sanctioned way to save minutes on docs PRs. The job
      # runs, the check reports, and only the expensive steps are skipped.
      # Fail-safe direction is "run everything": any ambiguity (non-PR event,
      # unreadable diff, empty diff) resolves to a full run, never to a skip.
      - name: Classify change scope
        id: scope
        env:
          # Passed as env rather than interpolated into the script body: an
          # expression expanded inline is textually spliced into bash before
          # it runs, which is the GitHub Actions script-injection shape CodeQL
          # flags. None of these three are attacker-controlled, but the habit
          # is what keeps the next added field safe.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          full_run() {
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event is $EVENT_NAME, not pull_request -> full run"
            full_run
          fi

          # stderr goes to a file, not into CHANGED: a git warning on an
          # otherwise successful diff would otherwise be parsed as a filename
          # and silently force a full run (harmless) or, with a different
          # message shape, be swallowed (not harmless).
          ERRLOG="${RUNNER_TEMP:-/tmp}/git-diff.err"
          if ! CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>"$ERRLOG")"; then
            echo "::notice::could not diff $BASE_SHA..$HEAD_SHA -> running the full gate (fail-safe)"
            cat "$ERRLOG" || true
            full_run
          fi

          if [ -z "$CHANGED" ]; then
            echo "::notice::empty changed-file list -> running the full gate (fail-safe)"
            full_run
          fi

          echo "changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          DOCS_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *)
                DOCS_ONLY=false
                break
                ;;
            esac
          done <<< "$CHANGED"

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "docs-only change set -> build/typecheck/tests short-circuited, check still reports"
            echo "scope=docs-only" >> "$GITHUB_OUTPUT"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "code touched -> full run"
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        # Matches Dockerfile:31 on every resolution-affecting flag. See the
        # header comment before changing this line.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # ── Compiler identity ─────────────────────────────────────────────
      # `npx tsc` in this estate can silently install a decoy tsc@2.0.4 that
      # exits 0 having compiled nothing (measured on droplinked-mcp,
      # 2026-09-01). This step never uses npx: it resolves the binary
      # explicitly, PRINTS the version into the log and the job summary so a
      # human can read it, and hard-fails on a pre-5.x major. The typecheck
      # step below runs `npm run typecheck`, which npm resolves through
      # node_modules/.bin — the exact path asserted here.
      - name: Compiler identity (proves the real tsc, not the decoy)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          BIN=./node_modules/.bin/tsc

          if [ ! -x "$BIN" ]; then
            echo "::error::$BIN is missing or not executable — typescript did not install. Refusing to typecheck with an unknown compiler."
            exit 1
          fi

          RESOLVED="$(readlink -f "$BIN")"
          RAW="$("$BIN" --version)"
          PKG="$(node -p 'require("typescript/package.json").version')"
          MAJOR="$(node -p 'require("typescript/package.json").version.split(".")[0]')"

          echo "binary          : $BIN"
          echo "resolves to     : $RESOLVED"
          echo "tsc --version   : $RAW"
          echo "package version : $PKG"

          if [ "$MAJOR" -lt 5 ]; then
            echo "::error::typescript major $MAJOR is below 5 — this is the decoy tsc@2.0.4 signature (it exits 0 having compiled nothing). Refusing to run."
            exit 1
          fi

          {
            echo "### Compiler identity"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| binary | \`$BIN\` |"
            echo "| resolves to | \`$RESOLVED\` |"
            echo "| \`tsc --version\` | \`$RAW\` |"
            echo "| package version | \`$PKG\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Build ─────────────────────────────────────────────────────────
      # Runs BEFORE the typecheck on purpose — see the ordering note in the
      # header. It is also the highest-consequence check in its own right: a
      # build failure here is an undeployable storefront. No Sentry
      # credentials are passed, so this step works identically on fork PRs;
      # withSentryConfig warns and skips the source-map upload.
      - name: Build (next build — also generates next-env.d.ts + .next/types)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail

          # A compiler that sees no files also exits 0. Probe the program size
          # before trusting the exit code. --listFilesOnly enumerates the
          # program without type-checking it, so this cannot itself fail on a
          # type error. Baseline on dev @ 4df0338: 2,967 files total, 280
          # outside node_modules. The floor is set well below that and well
          # above zero.
          PROG="${RUNNER_TEMP:-/tmp}/tsc-program.txt"
          ./node_modules/.bin/tsc --noEmit --listFilesOnly > "$PROG"
          TOTAL="$(wc -l < "$PROG" | tr -d ' ')"
          FIRST_PARTY="$(grep -vc '/node_modules/' "$PROG" || true)"
          echo "tsc program: $TOTAL files total, $FIRST_PARTY outside node_modules"

          if [ "$FIRST_PARTY" -lt 100 ]; then
            echo "::error::tsc program contains only $FIRST_PARTY first-party files (expected ~280). The compiler is not seeing the app; a green exit here would mean nothing."
            exit 1
          fi
          rm -f "$PROG"

          npm run typecheck

      - name: Tests
        if: steps.scope.outputs.docs_only != 'true'
        # `npm test` — node:test over src/__smoke__/ and scripts/__tests__/.
        # The file list lives in package.json, not here, so a local `npm test`
        # and CI run exactly the same suite.
        run: npm test

      # Always runs, including on the docs-only path, so the log states what
      # the green check actually covered rather than leaving a reader to
      # infer it.
      - name: Verdict
        if: always()
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -uo pipefail
          {
            echo ""
            echo "### Verdict"
            echo ""
            if [ "${SCOPE:-}" = "docs-only" ]; then
              echo "Change scope: **docs-only** — build, typecheck and tests were short-circuited inside the job."
              echo "The check still reports, so a required status is never left pending."
            else
              echo "Change scope: **full** — install (\`npm ci --legacy-peer-deps\`, matching Dockerfile:31), \`next build\`, \`tsc --noEmit\`, \`npm test\`."
            fi
            echo ""
            echo "Not covered by this gate: Playwright mobile suite (needs a live base URL), \`tests/tsconfig.json\` (3 pre-existing type errors, excluded from the root tsconfig), ESLint as a blocking step (\`next build\` reports it as warnings), runtime/integration behaviour against apiv3."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "scope=${SCOPE:-<unset, job failed before classification>}"
